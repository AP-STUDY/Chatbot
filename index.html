<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a1d">
<title>AP Chatter Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ff;--sf:#fff;--sf2:#efebff;--tx:#17132e;--mut:#6b6788;--bd:#e0daf5;--ac:linear-gradient(135deg,#ff6a3d,#e8368f 55%,#7c3aed);--a1:#e8368f;--ub:linear-gradient(135deg,#ff6a3d,#e8368f);--sh:0 8px 30px rgba(124,58,237,.12)}
[data-theme=dark]{--bg:#0c0a1d;--sf:#15122b;--sf2:#1d1938;--tx:#f1eeff;--mut:#9c97c0;--bd:#2a2547;--sh:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top,0)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--sf)}
.logo{width:38px;height:38px;border-radius:12px;background:var(--ac);display:grid;place-items:center;font-size:20px;box-shadow:var(--sh)}
.brand{flex:1;min-width:0}.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.2px}.brand span{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ib{width:36px;height:36px;border-radius:10px;background:var(--sf2);display:grid;place-items:center;font-size:17px;text-decoration:none}
.sel{background:var(--sf2);border:0;border-radius:10px;padding:8px 6px;font-size:13px;max-width:92px}
main{flex:1;position:relative;overflow:hidden}
.panel{display:none;position:absolute;inset:0;flex-direction:column}.panel.on{display:flex}
nav{display:flex;background:var(--sf);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:12px;font-size:12px;color:var(--mut);font-weight:500}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--tx);background:var(--sf2)}nav button.on i{filter:drop-shadow(0 2px 6px rgba(232,54,143,.6))}
.bar{display:flex;gap:8px;padding:8px 12px;align-items:center}
.pill{padding:7px 12px;border-radius:20px;background:var(--sf2);font-size:13px;font-weight:500}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.hero{margin:auto;text-align:center;padding:20px;max-width:420px}
.hero .big{font-size:54px;margin-bottom:8px}.hero h2{font-size:21px;line-height:1.35;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{padding:9px 14px;border-radius:18px;background:var(--sf);border:1px solid var(--bd);font-size:13.5px}
.m{display:flex;gap:8px;max-width:100%}.m.u{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:10px;background:var(--sf2);display:grid;place-items:center;font-size:16px;flex:none}
.bw{max-width:82%}.m.u .bw{display:flex;flex-direction:column;align-items:flex-end}
.bt{padding:10px 14px;border-radius:16px;line-height:1.55;font-size:15px;word-wrap:break-word;overflow-wrap:anywhere;background:var(--sf);border:1px solid var(--bd)}
.m.u .bt{background:var(--ub);color:#fff;border:0;border-bottom-right-radius:4px}.m.b .bt{border-top-left-radius:4px}
.bt pre{background:#0b0920;color:#e8e4ff;padding:10px;border-radius:10px;overflow-x:auto;margin:6px 0;font-size:13px}
.bt code{font-family:ui-monospace,monospace}
.ac{display:flex;gap:2px;margin-top:3px}.ac button{padding:4px 7px;border-radius:8px;font-size:14px;opacity:.65}.ac button:hover{opacity:1;background:var(--sf2)}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.comp{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--bd);background:var(--sf)}
.comp textarea{flex:1;resize:none;max-height:140px;min-height:42px;padding:10px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--bg);outline:0}
.comp textarea:focus,.f input:focus,.f textarea:focus{border-color:var(--a1)}
.go{width:42px;height:42px;border-radius:50%;background:var(--ac);color:#fff;font-size:18px;flex:none;box-shadow:var(--sh)}
.go:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
.ed{padding:6px 14px;font-size:12.5px;color:var(--a1);display:none}
.tool{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:6px}.f label{font-size:13px;color:var(--mut);font-weight:500}
.f textarea,.f select{padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--sf);outline:0;width:100%}
.f textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{padding:13px 18px;border-radius:14px;background:var(--ac);color:#fff;font-weight:600;font-size:15px;box-shadow:var(--sh)}
.btn.alt{background:var(--sf2);color:var(--tx);box-shadow:none}
.stage{min-height:260px;border:2px dashed var(--bd);border-radius:18px;display:grid;place-items:center;overflow:hidden;background:var(--sf);padding:8px;text-align:center;color:var(--mut)}
.stage img{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;display:none}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--bd);border-top-color:var(--a1);animation:sp 1s linear infinite;margin:0 auto 10px}@keyframes sp{to{transform:rotate(360deg)}}
input[type=range]{width:100%;accent-color:#e8368f}
audio{width:100%}
#drawer{position:fixed;inset:0;background:rgba(5,3,20,.55);display:none;z-index:20}#drawer.on{display:block}
#dr{position:absolute;left:0;top:0;bottom:0;width:min(86vw,340px);background:var(--sf);padding:14px;display:flex;flex-direction:column;gap:10px;padding-top:calc(14px + env(safe-area-inset-top,0))}
#cl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.ci{display:flex;align-items:center;gap:4px;padding:10px;border-radius:12px;background:var(--sf2)}.ci.on{outline:2px solid var(--a1)}.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:50}#toast.on{opacity:1;transform:translateX(-50%)}
@media(min-width:760px){.panel>*{width:100%;max-width:760px;margin-inline:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">🤖</div>
  <div class="brand"><b>AP Chatter Bot</b><span id="tag"></span></div>
  <select class="sel" id="lang" aria-label="Language"><option value="hinglish">Hinglish</option><option value="english">English</option><option value="hindi">हिन्दी</option><option value="urdu">اردو</option></select>
  <button class="ib" id="theme" aria-label="Theme">🌙</button>
  <a class="ib" href="https://t.me/ap_ultimate07" target="_blank" rel="noopener" aria-label="Telegram">✈️</a>
</header>

<main>
  <section class="panel on" id="p-chat">
    <div class="bar"><button class="pill" id="hist">☰ Chats</button><button class="pill" id="newc">＋ New</button><span style="flex:1"></span><span class="pill" id="mname"></span></div>
    <div id="msgs"></div>
    <div class="ed" id="ed">✏️ Editing message… <button id="edx" style="color:var(--a1)">Cancel</button></div>
    <div class="comp">
      <button class="ib" id="paste" aria-label="Paste">📋</button>
      <textarea id="inp" rows="1"></textarea>
      <button class="go" id="send" aria-label="Send">➤</button>
    </div>
  </section>

  <section class="panel" id="p-image"><div class="tool">
    <div class="f"><label>Prompt</label><textarea id="ip" placeholder="A cozy house on a hill at sunset, 4k"></textarea></div>
    <div class="f"><label>Size</label><select id="isz"><option value="sq">Square 1024×1024</option><option value="pt">Portrait 768×1024</option><option value="ls">Landscape 1024×768</option><option value="wd">Wide 1280×720</option></select></div>
    <div class="stage" id="stage"><div id="istate">Your image will appear here</div><img id="iimg" alt="Generated image"></div>
    <div class="row"><button class="btn" id="igen">Generate</button><button class="btn alt" id="idl" disabled>Download</button></div>
    <button class="btn alt" id="iregen" disabled>🔄 Regenerate</button>
  </div></section>

  <section class="panel" id="p-voice"><div class="tool">
    <div class="f"><label>Text</label><textarea id="vt" placeholder="Namaste, kaise ho?"></textarea></div>
    <div class="row">
      <div class="f"><label>Language</label><select id="vl"><option value="hi">Hindi</option><option value="en">English</option><option value="ur">Urdu</option><option value="hi:h">Hinglish</option></select></div>
      <div class="f"><label>Speed <b id="vsv">0.85</b>×</label><input type="range" id="vs" min="0.5" max="1.5" step="0.05" value="0.85" style="margin-top:12px"></div>
    </div>
    <button class="btn" id="vgo">Speak</button>
    <div class="stage" id="vstage" style="min-height:110px"><div id="vstate">Audio will appear here</div></div>
    <audio id="aud" controls style="display:none"></audio>
    <button class="btn alt" id="vdl" disabled>Download audio</button>
  </div></section>
</main>

<nav>
  <button data-t="chat" class="on"><i>💬</i><span data-k="chat">Chat</span></button>
  <button data-t="image"><i>🎨</i><span data-k="image">Image</span></button>
  <button data-t="voice"><i>🔊</i><span data-k="voice">Voice</span></button>
  <button data-t="gf"><i>💕</i><span>Riya</span></button>
</nav>

<div id="drawer"><div id="dr"><button class="btn" id="dnew">＋ New chat</button><div id="cl"></div></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const GF_NAME='Riya';
const COOLDOWN=45; // image cooldown (seconds)

/* ---- APIs: edit here ---- */
const CHAT_APIS=[ // tried in order (auto fallback); users cannot change this
  q=>`https://api-rebix.zone.id/api/gemini?q=${q}`,
  q=>`https://api-rebix.zone.id/api/claude-session?q=${q}`];
const GF_API=q=>`https://tuhari-girlfriend.vercel.app/gf?prompt=${q}`;
const VOICE_API=(t,l,s)=>`https://ai-pom-pom-bala.onrender.com/voice?text=${t}&lang=${l}&speed=${s}`;
const IMG_ENGINES=[ // tried in order (auto). Add a Gemini image URL here if you have one.
  (p,w,h,s)=>`https://image.pollinations.ai/prompt/${p}?width=${w}&height=${h}&seed=${s}&nologo=true&model=flux`,
  (p,w,h,s)=>`https://image.pollinations.ai/prompt/${p}?width=${w}&height=${h}&seed=${s}&nologo=true&model=turbo`];
const SIZES={sq:[1024,1024],pt:[768,1024],ls:[1024,768],wd:[1280,720]};

/* ---- i18n ---- */
const T={
 hinglish:{tag:'Chat, image aur voice — sab ek jagah',chat:'Chat',image:'Image',voice:'Voice',ph:'Kuch bhi poocho…',h:'Namaste! 👋 Main AP Chatter Bot hu. Aaj kya karein?',g:'Heyy 💕 Main Riya hu. Chalo baatein karte hain!',gen:'Generate',speak:'Speak'},
 english:{tag:'Chat, images and voice in one place',chat:'Chat',image:'Image',voice:'Voice',ph:'Ask me anything…',h:'Hi! 👋 I\'m AP Chatter Bot. What shall we do today?',g:'Heyy 💕 I\'m Riya. Let\'s talk!',gen:'Generate',speak:'Speak'},
 hindi:{tag:'चैट, इमेज और वॉइस — सब एक जगह',chat:'चैट',image:'इमेज',voice:'वॉइस',ph:'कुछ भी पूछिए…',h:'नमस्ते! 👋 मैं AP Chatter Bot हूँ। आज क्या करें?',g:'हे 💕 मैं रिया हूँ। चलो बातें करते हैं!',gen:'बनाएँ',speak:'सुनाएँ'},
 urdu:{tag:'چیٹ، تصویر اور آواز — سب ایک جگہ',chat:'چیٹ',image:'تصویر',voice:'آواز',ph:'کچھ بھی پوچھیں…',h:'السلام علیکم! 👋 میں AP Chatter Bot ہوں۔ آج کیا کریں؟',g:'ہائے 💕 میں ریا ہوں۔ آؤ باتیں کریں!',gen:'بنائیں',speak:'سنائیں'}};
const CHIPS={chat:['Ek joke sunao 😄','Python loop samjhao','Mujhe motivate karo'],gf:['Kaisi ho?','Aaj ka din kaisa tha?','Ek shayari sunao']};

/* ---- state ---- */
let S={chats:[],cur:{chat:null,gf:null},lang:'hinglish',theme:'dark'};
try{Object.assign(S,JSON.parse(localStorage.getItem('apb')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('apb',JSON.stringify(S))}catch(e){}};
let tab='chat',busy=false,ctl=null,editIdx=null;
const mode=()=>tab==='gf'?'gf':'chat';
const cc=()=>S.chats.find(c=>c.id===S.cur[mode()]);
const L=()=>T[S.lang];

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Copied ✓')}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmt(s){return esc(s).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,'<pre><code>$2</code></pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>').replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g,(m)=>m.replace(/<br>/g,'\n'))}

/* ---- network ---- */
function pick(o){if(typeof o==='string')return o;if(Array.isArray(o)){for(const x of o){const r=pick(x);if(r)return r}return''}
 if(o&&typeof o==='object'){for(const k of['response','result','answer','reply','message','text','data','output','content']){if(o[k]){const r=pick(o[k]);if(r)return r}}for(const k in o){const r=pick(o[k]);if(r)return r}}return''}
async function getText(url,signal){let r;try{r=await fetch(url,{signal})}catch(e){if(e.name==='AbortError')throw e;r=await fetch('https://corsproxy.io/?'+encodeURIComponent(url),{signal})}
 if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();try{return pick(JSON.parse(t))||t}catch(e){return t}}
async function blobDownload(url,name){try{let r;try{r=await fetch(url)}catch(e){r=await fetch('https://corsproxy.io/?'+encodeURIComponent(url))}
 const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){window.open(url,'_blank');toast('Opened in new tab — long-press to save')}}

/* ---- chat ---- */
function newChat(){const c={id:Date.now(),mode:mode(),title:'New chat',msgs:[]};S.chats.unshift(c);S.cur[mode()]=c.id;save();return c}
function render(){
 const c=cc(),box=$('#msgs'),g=tab==='gf';
 $('#mname').textContent=g?GF_NAME+' 💕':'AP Bot';
 if(!c||!c.msgs.length){box.innerHTML=`<div class="hero"><div class="big">${g?'💕':'🤖'}</div><h2>${g?L().g:L().h}</h2><div class="chips">${CHIPS[mode()].map(x=>`<button data-chip="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`;return}
 box.innerHTML=c.msgs.map((m,i)=>{const u=m.r==='u';return `<div class="m ${m.r}"><div class="av">${u?'🙂':g?'💕':'🤖'}</div><div class="bw"><div class="bt">${m.loading?'<div class="dots"><span></span><span></span><span></span></div>':fmt(m.t)}</div>${m.loading?'':`<div class="ac">${u?`<button data-a="edit" data-i="${i}" title="Edit">✏️</button>`:`<button data-a="regen" data-i="${i}" title="Regenerate">🔄</button>`}<button data-a="copy" data-i="${i}" title="Copy">📋</button><button data-a="del" data-i="${i}" title="Delete">🗑️</button></div>`}</div></div>`}).join('');
 box.scrollTop=box.scrollHeight}
function setBusy(b){busy=b;$('#send').textContent=b?'⏹':'➤'}
function ctxq(c,h){const m=c.msgs.filter(x=>x!==h&&!x.loading).slice(-7);if(m.length<2)return m.length?m[0].t:'';return m.slice(0,-1).map(x=>(x.r==='u'?'User: ':'AI: ')+x.t.slice(0,300)).join('\n').concat('\nUser: '+m[m.length-1].t).slice(-1500)}
async function reply(c){
 setBusy(true);ctl=new AbortController();const h={r:'b',t:'',loading:true};c.msgs.push(h);render();
 let ans='';
 try{
  const q=encodeURIComponent(ctxq(c,h));
  if(mode()==='gf')ans=await getText(GF_API(q),ctl.signal);
  else{let err;for(const f of CHAT_APIS){try{ans=await getText(f(q),ctl.signal);if(ans)break}catch(e){if(e.name==='AbortError')throw e;err=e}}if(!ans)throw err||new Error('empty')}
  ans=ans.trim()||'…';h.loading=false;render();
  const el=$('#msgs').lastElementChild.querySelector('.bt');
  for(let i=0;i<ans.length;i+=3){if(ctl.signal.aborted)break;h.t=ans.slice(0,i+3);el.innerHTML=fmt(h.t);$('#msgs').scrollTop=1e9;await sleep(10)}
  if(!ctl.signal.aborted)h.t=ans;
 }catch(e){
  const i=c.msgs.indexOf(h);
  if(e.name==='AbortError'){if(h.loading)c.msgs.splice(i,1)}
  else{h.loading=false;h.t='⚠️ Reply nahi aaya (server slow ya band ho sakta hai). 🔄 Regenerate dabao.'}
 }
 setBusy(false);save();render()}
async function send(t){t=(t||'').trim();if(!t||busy)return;let c=cc()||newChat();
 if(editIdx!=null){c.msgs=c.msgs.slice(0,editIdx);endEdit()}
 c.msgs.push({r:'u',t});if(c.title==='New chat')c.title=t.slice(0,32);save();$('#inp').value='';grow();render();await reply(c)}
function endEdit(){editIdx=null;$('#ed').style.display='none'}
function grow(){const i=$('#inp');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,140)+'px'}

$('#msgs').addEventListener('click',e=>{
 const ch=e.target.closest('[data-chip]');if(ch)return send(ch.dataset.chip);
 const b=e.target.closest('[data-a]');if(!b)return;const c=cc(),i=+b.dataset.i,m=c.msgs[i];
 if(b.dataset.a==='copy')copy(m.t);
 else if(b.dataset.a==='del'&&!busy){c.msgs.splice(i,1);save();render()}
 else if(b.dataset.a==='edit'&&!busy){editIdx=i;$('#inp').value=m.t;grow();$('#inp').focus();$('#ed').style.display='block'}
 else if(b.dataset.a==='regen'&&!busy){c.msgs=c.msgs.slice(0,i);save();reply(c)}});
$('#send').onclick=()=>busy?ctl.abort():send($('#inp').value);
$('#inp').addEventListener('input',grow);
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>760){e.preventDefault();$('#send').click()}});
$('#paste').onclick=async()=>{try{const t=await navigator.clipboard.readText();$('#inp').value+=t;grow();$('#inp').focus()}catch(e){toast('Paste: long-press in the box')}};
$('#edx').onclick=()=>{endEdit();$('#inp').value='';grow()};
$('#newc').onclick=()=>{if(busy)return;newChat();render()};
$('#hist').onclick=()=>{drawer();$('#drawer').classList.add('on')};
$('#dnew').onclick=()=>{newChat();render();$('#drawer').classList.remove('on')};
$('#drawer').onclick=e=>{if(e.target.id==='drawer')$('#drawer').classList.remove('on')};
function drawer(){const l=S.chats.filter(c=>c.mode===mode());$('#cl').innerHTML=l.length?l.map(c=>`<div class="ci ${c.id===S.cur[mode()]?'on':''}"><span data-o="${c.id}">${esc(c.title)}</span><button class="ib" data-r="${c.id}" style="width:30px;height:30px">✏️</button><button class="ib" data-d="${c.id}" style="width:30px;height:30px">🗑️</button></div>`).join(''):'<p style="color:var(--mut);padding:8px">No chats yet</p>'}
$('#cl').onclick=e=>{const t=e.target.closest('[data-o],[data-r],[data-d]');if(!t)return;
 if(t.dataset.o){S.cur[mode()]=+t.dataset.o;save();render();$('#drawer').classList.remove('on')}
 else if(t.dataset.r){const c=S.chats.find(x=>x.id==t.dataset.r),n=prompt('Rename chat',c.title);if(n){c.title=n.slice(0,40);save();drawer()}}
 else if(confirm('Delete this chat?')){S.chats=S.chats.filter(x=>x.id!=t.dataset.d);if(S.cur[mode()]==t.dataset.d)S.cur[mode()]=null;save();drawer();render()}};

/* ---- image ---- */
let cdEnd=+(localStorage.getItem('apb_cd')||0),igBusy=false,lastUrl='';
function cdTick(){const left=Math.ceil((cdEnd-Date.now())/1000),on=left>0||igBusy;
 $('#igen').disabled=on;$('#iregen').disabled=on||!lastUrl;$('#idl').disabled=!lastUrl;
 $('#igen').textContent=left>0?`⏳ ${left}s`:L().gen;$('#iregen').textContent=left>0?`⏳ Wait ${left}s`:'🔄 Regenerate'}
setInterval(cdTick,500);
function loadImg(u){return new Promise((res,rej)=>{const im=new Image(),t=setTimeout(()=>rej(),120000);im.onload=()=>{clearTimeout(t);res(u)};im.onerror=()=>{clearTimeout(t);rej()};im.src=u})}
async function genImage(){const p=$('#ip').value.trim();if(!p)return toast('Prompt likho pehle');if(igBusy||Date.now()<cdEnd)return;
 igBusy=true;cdTick();const [w,h]=SIZES[$('#isz').value],img=$('#iimg');img.style.display='none';
 $('#istate').style.display='block';$('#istate').innerHTML='<div class="spin"></div>Image ban rahi hai…';
 let ok=false;for(const f of IMG_ENGINES){try{const u=f(encodeURIComponent(p),w,h,Math.floor(Math.random()*1e9));await loadImg(u);img.src=u;lastUrl=u;ok=true;break}catch(e){}}
 if(ok){img.style.display='block';$('#istate').style.display='none';cdEnd=Date.now()+COOLDOWN*1000;try{localStorage.setItem('apb_cd',cdEnd)}catch(e){}}
 else{$('#istate').innerHTML='⚠️ Image nahi bani. Dubara try karo.'}
 igBusy=false;cdTick()}
$('#igen').onclick=genImage;$('#iregen').onclick=genImage;
$('#idl').onclick=()=>lastUrl&&blobDownload(lastUrl,`AP_Image_${Date.now()}.jpg`);

/* ---- voice ---- */
let vUrl='';
$('#vs').oninput=e=>$('#vsv').textContent=(+e.target.value).toFixed(2);
$('#vgo').onclick=()=>{const t=$('#vt').value.trim();if(!t)return toast('Text likho pehle');
 const l=$('#vl').value.split(':')[0];vUrl=VOICE_API(encodeURIComponent(t),l,$('#vs').value);
 const a=$('#aud');a.style.display='none';$('#vstate').style.display='block';$('#vstate').innerHTML='<div class="spin"></div>Audio ban raha hai… (pehli baar 30-60 sec lag sakte hain)';$('#vgo').disabled=true;
 a.oncanplay=()=>{$('#vstate').style.display='none';a.style.display='block';$('#vgo').disabled=false;$('#vdl').disabled=false;a.play().catch(()=>{})};
 a.onerror=()=>{$('#vstate').innerHTML='⚠️ Audio nahi bana. Dubara try karo.';$('#vgo').disabled=false};
 a.src=vUrl};
$('#vdl').onclick=()=>vUrl&&blobDownload(vUrl,`AP_Voice_${Date.now()}.mp3`);

/* ---- tabs, theme, language ---- */
function showTab(t){if(busy&&(t==='chat'||t==='gf'))return;tab=t;$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 const p=t==='gf'?'chat':t;$$('.panel').forEach(x=>x.classList.toggle('on',x.id==='p-'+p));if(p==='chat'){endEdit();render()}}
$$('nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
function applyTheme(){document.documentElement.dataset.theme=S.theme;$('#theme').textContent=S.theme==='dark'?'🌙':'☀️';$('meta[name=theme-color]').content=S.theme==='dark'?'#0c0a1d':'#f6f4ff'}
$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';save();applyTheme()};
function applyLang(){const l=L();$('#lang').value=S.lang;$('#tag').textContent=l.tag;$$('[data-k]').forEach(e=>e.textContent=l[e.dataset.k]);$('#inp').placeholder=l.ph;$('#vgo').textContent=l.speak;cdTick();if(tab==='chat'||tab==='gf')render()}
$('#lang').onchange=e=>{S.lang=e.target.value;save();applyLang()};
applyTheme();applyLang();
</script>
</body>
</html>
